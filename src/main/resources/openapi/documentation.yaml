components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user-session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    # Enums
    EventStatus:
      type: string
      enum:
        - NOT_STARTED
        - ACTIVE
        - CANCELED
        - PAUSED
        - COMPLETED
    EventStage:
      type: string
      enum:
        - REGULAR_SEASON
        - PLAYOFFS
        - PROMOTION_RELEGATION

    # Auth Schemas
    LoginDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ruuffian
        password:
          type: string
          example: changeit

    CreateTokenDto:
      type: object
      required:
        - name
        - expiresAt
        - scopes
      properties:
        name:
          type: string
          example: todd-bot
        expiresAt:
          type: string
          format: date-time
          example: "2027-01-01T00:00:00.000Z"
        scopes:
          type: string
          description: Colon-delimited scope list.
          example: 'user:admin'


    # Game Schemas
    TournamentCodeDto:
      type: object
      description: |
        A tournament code issued by Riot for a series. A code may back zero
        games — it can be issued and never played — so codes are counted
        separately from games.
      required:
        - id
        - shortcode
        - seriesId
        - blueTeamId
        - redTeamId
        - createdAt
      properties:
        id:
          type: integer
          example: 117
        shortcode:
          type: string
          example: NA04eff-c5b0b774-c049-47cf-88f4-eee05c8d83ae
        seriesId:
          type: integer
          example: 42
        blueTeamId:
          type: integer
          example: 7
        redTeamId:
          type: integer
          example: 12
        createdAt:
          type: string
          format: date-time
          example: "2026-07-14T22:58:31.204Z"

    GameDto:
      type: object
      description: |
        A game that was actually played. `tournamentCodeId` and `riotMatchId`
        are null for a custom game played without a code — Riot cannot serve
        custom match data, so those are recorded from a self-reported result.
        `number` is derived from the count of games in the series, so a code
        that is never played does not consume a game number.
      required:
        - id
        - seriesId
        - number
        - createdAt
      properties:
        id:
          type: integer
          example: 88
        seriesId:
          type: integer
          example: 42
        tournamentCodeId:
          type: integer
          nullable: true
          description: Null when the game was played without a tournament code.
          example: 117
        riotMatchId:
          type: string
          nullable: true
          description: "`{platformId}_{gameId}`. Null when there is no Riot record."
          example: NA1_5102531894
        number:
          type: integer
          description: Position within the series, derived as games played + 1.
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-07-14T23:12:04.318Z"
        result:
          type: object
          nullable: true
          description: Null until a result has been recorded.
          allOf:
            - $ref: "#/components/schemas/GameResultDto"

    GameResultDto:
      type: object
      required:
        - winningTeamId
        - losingTeamId
      properties:
        winningTeamId:
          type: integer
          example: 7
        losingTeamId:
          type: integer
          example: 12

    CreateGameDto:
      type: object
      required:
        - blueTeamId
        - redTeamId
      properties:
        blueTeamId:
          type: integer
          example: 7
        redTeamId:
          type: integer
          example: 12

    # Event Group Schemas
    CreateEventGroupDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Season 15
        eventIds:
          type: array
          items:
            type: integer
          nullable: true
          example: [ ]

    EventGroupDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Season 15 Regular Season

    EventGroupWithEventsDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Season 15 Regular Season
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventDto"

    PatchEventGroupDto:
      type: object
      description: Fields to update on an event group
      properties:
        name:
          type: string
          example: Season 15 Playoffs

    EventGroupAddEventDto:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: integer
          example: 123

    # Event Schemas
    CreateEventDto:
      type: object
      required:
        - name
        - startDate
        - endDate
        - status
        - eventStages
      properties:
        name:
          type: string
          example: Season 15 Emerald Division
        description:
          type: string
          description: Describe the event!
          example: The Season 15 plat-emerald league.
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - description: The intended starting status of the event.
            - example: NOT_STARTED
            - $ref: "#/components/schemas/EventStatus"
        eventStages:
          type: array
          items:
            allOf:
              - description: The valid stages of the event.
              - $ref: "#/components/schemas/EventStage"

    EventDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - eventStages
      properties:
        id:
          type: integer
          format: int64
          example: 12
        name:
          type: string
          description: Event name
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T18:00:00.000Z"
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 3
          nullable: true
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    EventWithTeamsDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - teams
        - eventStages
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T18:00:00.000Z"
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 3
          nullable: true
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    EventWithSeriesDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - series
        - eventStages
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T18:00:00.000Z"
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 3
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDto"
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    PatchEventDto:
      type: object
      properties:
        name:
          type: string
          description: Event name
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - description: The new event status.
            - example: CANCELED
            - $ref: "#/components/schemas/EventStatus"

    EventAddTeamDto:
      type: object
      required:
        - teamId
      properties:
        teamId:
          type: integer
          example: 3

    CreateSeriesDto:
      type: object
      required:
        - team1Id
        - team2Id
        - totalGames
        - stage
      properties:
        team1Id:
          type: integer
          example: 7
        team2Id:
          type: integer
          example: 12
        totalGames:
          type: integer
          example: 3
        stage:
          type: string
          example: REGULAR_SEASON

    # Player Schemas
    NewPlayerDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: ruuffian#FUNZ

    PlayerDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/RiotAccountDto"

    PlayerWithTeamsDto:
      type: object
      required:
        - id
        - name
        - teams
      properties:
        id:
          type: integer
        name:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/RiotAccountDto"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"

    AccountLinkRequestDto:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: integer

    PatchPlayerDto:
      type: object
      properties:
        name:
          type: string
          description: New player name (not necessarily a Riot ID)
          example: newname

    # Riot Account Schemas
    NewRiotAccountDto:
      type: object
      required:
        - riotPuuid
      properties:
        riotPuuid:
          type: string
          description: Riot's permanent unique user ID (78 chars)

    RiotAccountDto:
      type: object
      required:
        - id
        - riotPuuid
      properties:
        id:
          type: integer
        riotPuuid:
          type: string
          description: Riot's permanent unique user ID (78 chars)
        playerId:
          type: integer
          nullable: true

    # Team Schemas
    NewTeamDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Golden Guardians
        logo:
          type: string
          example: https://google.com
        eventId:
          type: integer
          example: 1
          nullable: true

    PatchTeamDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          example: Golden Guardians Rebranded
        logo:
          type: string
          example: https://google.com

    TeamDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
        eventId:
          type: integer
          nullable: true

    TeamWithPlayersDto:
      type: object
      required:
        - id
        - name
        - players
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
        eventId:
          type: integer
          nullable: true
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerDto"

    TeamPlayerLinkRequestDto:
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: integer

    # Series Schema
    SeriesDto:
      type: object
      required:
        - id
        - teamIds
        - totalGames
        - eventStage
        - completed
      properties:
        id:
          type: integer
          example: 42
        eventId:
          type: integer
          example: 12
          nullable: true
        teamIds:
          type: array
          items:
            type: integer
          example: [ 7, 12 ]
        totalGames:
          type: integer
          example: 3
        eventStage:
          allOf:
            - $ref: "#/components/schemas/EventStage"
            - description: The stage of the event this series belongs to.
            - example: PLAYOFFS
        completed:
          type: boolean
          description: |
            Whether this series is finished. Denny's sets this automatically
            when recorded results give one team more than `totalGames / 2`
            wins. It is a routing flag used to pick between two active series
            for the same pair of teams — it does not gate code generation.
          example: false
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the series was completed. Null while `completed` is false.
          example: null

    SeriesWithGamesDto:
      type: object
      description: |
        A series together with every tournament code issued for it and every
        game actually played. Codes issued is `tournamentCodes.length`; games
        played is `games.length`. The two differ whenever a code was issued
        but never played.
      required:
        - id
        - teamIds
        - totalGames
        - eventStage
        - completed
        - tournamentCodes
        - games
      properties:
        id:
          type: integer
          example: 42
        eventId:
          type: integer
          example: 12
          nullable: true
        teamIds:
          type: array
          items:
            type: integer
          example: [ 7, 12 ]
        totalGames:
          type: integer
          example: 3
        eventStage:
          allOf:
            - $ref: "#/components/schemas/EventStage"
            - description: The stage of the event this series belongs to.
            - example: PLAYOFFS
        completed:
          type: boolean
          example: false
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        tournamentCodes:
          type: array
          items:
            $ref: "#/components/schemas/TournamentCodeDto"
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameDto"
        lastCodeIssuedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recently issued tournament code.
          example: "2026-07-14T23:41:09.882Z"
        lastGameAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp of the most recently recorded game. Clients use this
            together with `lastCodeIssuedAt` to nag on an unreported game.
          example: "2026-07-14T23:12:04.318Z"

    ReportResultDto:
      type: object
      description: |
        Report the result of a game. Target a specific tournament code with
        `tournamentCodeId` **or** `shortcode`, never both. When neither is
        given, Denny's asks Riot which outstanding code has a game: if Riot
        attributes one, the game is recorded against that code with Riot's
        winner; if Riot attributes none, the game is recorded as codeless.
        A report never guesses which code was played.

        With no winner named, the same pass supplies the winner, and the
        caller's claim is used only when Riot has no record.
      properties:
        winnerTeamId:
          type: integer
          description: Ignored when Riot has a record of the game.
          example: 7
        loserTeamId:
          type: integer
          example: 12
        tournamentCodeId:
          type: integer
          description: Denny's id for the code. Mutually exclusive with `shortcode`.
          example: 117
        shortcode:
          type: string
          description: |
            The Riot tournament code itself, as it appears in the game client.
            Mutually exclusive with `tournamentCodeId`. Exists because a human
            reporting a result has the code, not a database id.
          example: NA04eff-c5b0b774-c049-47cf-88f4-eee05c8d83ae

    CompleteSeriesDto:
      type: object
      description: |
        Manually close a series. Also the forfeit path — a winner with zero
        games played.
      properties:
        winnerTeamId:
          type: integer
          example: 7
        loserTeamId:
          type: integer
          example: 12

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      required:
        - code
        - message

security:
  - cookieAuth: [ ]
  - bearerAuth: [ ]
