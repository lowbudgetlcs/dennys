        eventGroupId:
          type: integer
          example: 3
          nullable: true
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    EventWithTeamsDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - teams
        - eventStages
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T18:00:00.000Z"
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 3
          nullable: true
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    EventWithSeriesDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - series
        - eventStages
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T18:00:00.000Z"
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 3
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDto"
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    PatchEventDto:
      type: object
      properties:
        name:
          type: string
          description: Event name
          example: Season 15 Emerald Division
        description:
          type: string
          example: The Season 15 plat-emerald league.
        startDate:
          type: string
          format: date-time
          example: "2026-06-08T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-08-31T00:00:00.000Z"
        status:
          allOf:
            - description: The new event status.
            - example: CANCELED
            - $ref: "#/components/schemas/EventStatus"

    EventAddTeamDto:
      type: object
      required:
        - teamId
      properties:
        teamId:
          type: integer
          example: 3

    CreateSeriesDto:
      type: object
      required:
        - team1Id
        - team2Id
        - totalGames
        - stage
      properties:
        team1Id:
          type: integer
          example: 7
        team2Id:
          type: integer
          example: 12
        totalGames:
          type: integer
          example: 3
        stage:
          type: string
          example: REGULAR_SEASON

    # Player Schemas
    NewPlayerDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: ruuffian#FUNZ

    PlayerDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/RiotAccountDto"

    PlayerWithTeamsDto:
      type: object
      required:
        - id
        - name
        - teams
      properties:
        id:
          type: integer
        name:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/RiotAccountDto"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"

    AccountLinkRequestDto:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: integer

    PatchPlayerDto:
      type: object
      properties:
        name:
          type: string
          description: New player name (not necessarily a Riot ID)
          example: newname

    # Riot Account Schemas
    NewRiotAccountDto:
      type: object
      required:
        - riotPuuid
      properties:
        riotPuuid:
          type: string
          description: Riot's permanent unique user ID (78 chars)

    RiotAccountDto:
      type: object
      required:
        - id
        - riotPuuid
      properties:
        id:
          type: integer
        riotPuuid:
          type: string
          description: Riot's permanent unique user ID (78 chars)
        playerId:
          type: integer
          nullable: true

    # Team Schemas
    NewTeamDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Golden Guardians
        logo:
          type: string
          example: https://google.com
        eventId:
          type: integer
          example: 1
          nullable: true

    PatchTeamDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          example: Golden Guardians Rebranded
        logo:
          type: string
          example: https://google.com

    TeamDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
        eventId:
          type: integer
          nullable: true

    TeamWithPlayersDto:
      type: object
      required:
        - id
        - name
        - players
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
        eventId:
          type: integer
          nullable: true
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerDto"

    TeamPlayerLinkRequestDto:
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: integer

    # Series Schema
    SeriesDto:
      type: object
      required:
        - id
        - teamIds
        - totalGames
        - eventStage
        - status
      properties:
        id:
          type: integer
          example: 42
        eventId:
          type: integer
          example: 12
          nullable: true
        teamIds:
          type: array
          items:
            type: integer
          example: [ 7, 12 ]
        totalGames:
          type: integer
          example: 3
        eventStage:
          allOf:
            - $ref: "#/components/schemas/EventStage"
            - description: The stage of the event this series belongs to.
            - example: PLAYOFFS
        status:
          allOf:
            - $ref: "#/components/schemas/SeriesStatus"
            - description: |
                Denny's moves a `NOT_STARTED` or `IN_PROGRESS` series to
                `COMPLETE` when recorded results give one team more than
                `totalGames / 2` wins. It never auto-completes a series in any
                other status. The first code issued or game recorded moves a
                `NOT_STARTED` series to `IN_PROGRESS`. Status does not gate code
                generation.
            - example: IN_PROGRESS
        winnerTeamId:
          type: integer
          nullable: true
          description: The winner, when a result is recorded. Null on a double loss.
          example: 7
        doubleLoss:
          type: boolean
          description: A loss for both teams with no winner (rulebook §5.5.2).
          example: false

    SeriesWithGamesDto:
      type: object
      description: |
        A series together with every tournament code issued for it and every
        game actually played. Codes issued is `tournamentCodes.length`; games
        played is `games.length`. The two differ whenever a code was issued
        but never played.
      required:
        - id
        - teamIds
        - totalGames
        - eventStage
        - status
        - tournamentCodes
        - games
      properties:
        id:
          type: integer
          example: 42
        eventId:
          type: integer
          example: 12
          nullable: true
        teamIds:
          type: array
          items:
            type: integer
          example: [ 7, 12 ]
        totalGames:
          type: integer
          example: 3
        eventStage:
          allOf:
            - $ref: "#/components/schemas/EventStage"
            - description: The stage of the event this series belongs to.
            - example: PLAYOFFS
        status:
          allOf:
            - $ref: "#/components/schemas/SeriesStatus"
            - example: IN_PROGRESS
        winnerTeamId:
          type: integer
          nullable: true
          description: The winner, when a result is recorded. Null on a double loss.
          example: 7
        doubleLoss:
          type: boolean
          description: A loss for both teams with no winner (rulebook §5.5.2).
          example: false
        tournamentCodes:
          type: array
          items:
            $ref: "#/components/schemas/TournamentCodeDto"
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameDto"
        lastCodeIssuedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recently issued tournament code.
          example: "2026-07-14T23:41:09.882Z"
        lastGameAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp of the most recently recorded game. Clients use this
            together with `lastCodeIssuedAt` to nag on an unreported game.
          example: "2026-07-14T23:12:04.318Z"

    ReportResultDto:
      type: object
      description: |
        Report the result of a game. Target a specific tournament code with
        `tournamentCodeId` **or** `shortcode`, never both. When neither is
        given, the game is recorded as codeless, as for a custom game.
      required:
        - winnerTeamId
      properties:
        winnerTeamId:
          type: integer
          example: 7
        loserTeamId:
          type: integer
          example: 12
        tournamentCodeId:
          type: integer
          description: Denny's id for the code. Mutually exclusive with `shortcode`.
          example: 117
        shortcode:
          type: string
          description: |
            The Riot tournament code itself, as it appears in the game client.
            Mutually exclusive with `tournamentCodeId`. Exists because a human
            reporting a result has the code, not a database id.
          example: NA04eff-c5b0b774-c049-47cf-88f4-eee05c8d83ae

    RefreshSeriesDto:
      type: object
      description: |
        Identifies the one tournament code to re-check against Riot. Exactly one
        of these must be set — unlike `ReportResultDto`, omitting both is a 422
        rather than a codeless game.
      properties:
        tournamentCodeId:
          type: integer
          description: Denny's id for the code. Mutually exclusive with `shortcode`.
          example: 117
        shortcode:
          type: string
          description: |
            The Riot tournament code itself. Mutually exclusive with
            `tournamentCodeId`.
          example: NA04eff-c5b0b774-c049-47cf-88f4-eee05c8d83ae

    PatchSeriesDto:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/SeriesStatus"
        winnerTeamId:
          type: integer
          description: Only with `status` `COMPLETE`. The loser is derived.
          example: 7
        doubleLoss:
          type: boolean
          default: false
          description: Only with `status` `COMPLETE`, and never with `winnerTeamId`.

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        reason:
          type: string
          nullable: true
          description: |
            Identifies which conflict a `409` is, where a client needs to tell
            them apart. `CODE_LIMIT`: the per-game tournament code limit.
          example: CODE_LIMIT
      required:
        - code
        - message

security:
  - cookieAuth: [ ]
  - bearerAuth: [ ]
