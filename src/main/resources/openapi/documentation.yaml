openapi: 3.0.3
info:
  title: Dennys - OpenAPI 3.0
  description: |-
    This is the Dennys OpenAPI 3.0 specification.
  contact:
    email: lblcs.dev@gmail.com
  license:
    name: MIT
    url: https://github.com/lowbudgetlcs/dennys/blob/main/LICENSE.txt
  version: 1.4.0
externalDocs:
  description: Find out more about Dennys
  url: https://github.com/lowbudgetlcs/dennys
servers:
  - url: /

tags:
  - name: Authentication
  - name: Event Groups (v1)
    description: Manage event groups
  - name: Events (v1)
    description: Manage Event
  - name: Series (v1)
    description: Create games inside of a series
  - name: Teams (v1)
    description: Manage teams
  - name: Players (v1)
    description: Manage players
  - name: Accounts (v1)
    description: Manage riot accounts

paths:
  /login:
    post:
      summary: Start a session with username/password.
      operationId: login
      tags:
        - Authentication
      requestBody:
        description: Valid credentials
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "201":
          description: >
            Successfully authenticated.
            The session identifier is returned in a cookie named `user-session`.
            This cookie must be included in subsequent requests.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "user-session=%7B%22id%22%3A%226c61476b-da90-4cae-82e3-cf009e628f3e%22%2C%22userId%22%3A1%2C%22expiresAt%22%3A%222026-01-04T04%3A55%3A06.154275Z%22%7D; Max-Age=10800; Expires=Sun, 04 Jan 2026 06:55:06 GMT; Path=/; Secure; HttpOnly; SameSite=strict; $x-enc=URI_ENCODING"
        "401":
          description: Failed to authenticate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

      security: [ ]
  /logout:
    post:
      summary: End the current session.
      security:
        - cookieAuth: [ ]
      description: Removes the currently active session.
      operationId: logout
      tags:
        - Authentication
      responses:
        "200":
          description: Successfully deleted active session.
        "401":
          description: Failed to authenticate, no active session found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /createToken:
    post:
      summary: Issue an API token for the current user.
      security:
        - cookieAuth: [ ]
      description: |
        Create an API token for the currently logged-in user. The token is
        returned in plaintext exactly once — only its hash is stored.
      operationId: createToken
      tags:
        - Authentication
      requestBody:
        description: Token parameters.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenDto"
      responses:
        "201":
          description: Successfully created token.
          content:
            text/plain:
              schema:
                type: string
                example: ABCDEFG123456
        "401":
          description: Failed to authenticate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



  # Event Group Endpoints
  /api/v1/eventGroup:
    get:
      summary: Get all event groups
      operationId: getEventGroups
      tags:
        - Event Groups (v1)
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventGroupDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a new event group
      operationId: createEventGroup
      tags:
        - Event Groups (v1)
      requestBody:
        description: Event group specification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventGroupDto"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - One of the events in eventIds is already in another event group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}:
    get:
      summary: Get an event group by ID
      operationId: getEventGroupById
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Event group found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Patch an event group's data
      operationId: patchEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group to update
          schema:
            type: integer
      requestBody:
        required: true
        description: Fields to update on the event group
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventGroupDto"
      responses:
        "200":
          description: Event group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}/events:
    get:
      summary: Get an event group with all events included
      operationId: getEventsInEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group
          schema:
            type: integer
      responses:
        "200":
          description: List of events in the event group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventGroupWithEventsDto"
        "404":
          description: Event group not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add an event to an event group
      operationId: addEventToEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventGroupAddEventDto"
      responses:
        "200":
          description: Event added to event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupWithEventsDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event group or event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}/events/{eventId}:
    delete:
      summary: Remove an event from an event group
      operationId: removeEventFromEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event removed from event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupWithEventsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Event Endpoints
  /api/v1/event:
    get:
      tags:
        - Events (v1)
      summary: Get all events
      description: Fetch a list of all events.
      operationId: getEvents
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter events matching this name. Partial completions are allowed.
        - in: query
          name: status
          schema:
            allOf:
              - description: The intended starting status of the event.
              - example: NOT_STARTED
              - $ref: "#/components/schemas/EventStatus"
          description: Filter only series in this event stage.

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Events (v1)
      summary: Create a new event.
      description: |
        Registers an event with Dennys, and optionally assign it to an event group
      operationId: addEvent
      requestBody:
        description: Event specification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventDto"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}:
    get:
      tags:
        - Events (v1)
      summary: Get an event by ID.
      description: Returns a single event with the associated teams.
      operationId: getEventById
      parameters:
        - name: eventId
          in: path
          description: ID of event to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Missing or malformed id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Events (v1)
      summary: Patch an event's data
      parameters:
        - name: eventId
          in: path
          description: ID of event to update
          required: true
          schema:
            type: integer
            format: int64
      operationId: patchEvent
      requestBody:
        required: true
        description: Patch existing event.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventDto"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/teams:
    get:
      summary: Get an event with all teams included
      operationId: getTeamsInEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
      responses:
        "200":
          description: List of teams in the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Link a team to an event
      operationId: addTeamToEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventAddTeamDto"
      responses:
        "200":
          description: Team added to event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - Team is already assigned to a different event
            - One or more players on this team are already assigned to a different team in this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/teams/{teamId}:
    delete:
      summary: Remove a team from an event
      operationId: removeTeamFromEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team removed from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Series Endpoints
  /api/v1/event/{eventId}/series:
    get:
      summary: Get all the series of an event
      operationId: getSeriesInEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
        - in: query
          name: teamIds
          schema:
            type: array
            items:
              type: integer
              uniqueItems: true
          description: |
            Filter only series with these teamIds (more than 2 
            teams guaruntees an empty array).
        - in: query
          name: stage
          schema:
            type: string
            example: REGULAR_SEASON
          description: Filter only series in this event stage.
        - in: query
          name: completed
          schema:
            type: boolean
          description: |
            Filter on series completion. Omitting the parameter returns both
            completed and active series, so existing callers are unaffected.
            Pass `false` to find the series a new tournament code should
            belong to when two series exist for the same pair of teams.
      responses:
        "200":
          description: The event, with the series matching the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSeriesDto"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a series for an event.
      operationId: addSeriesToEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesDto"
      responses:
        "201":
          description: Series created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDto"
        "400":
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - One or more teams are not in this event.

            Note that repeat series between the same two teams are supported —
            two teams may legitimately meet more than once inside one stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/series/{seriesId}:
    delete:
      summary: Remove a series from an event
      operationId: removeSeriesFromEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Series removed from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSeriesDto"
        "404":
          description: Event or series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The series has tournament codes issued against it and cannot be
            deleted. A tournament code is a real Riot artifact and may already
            have player stats keyed on its shortcode. Complete the series
            instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}:
    get:
      summary: Get a series with its tournament codes and games
      description: |
        The status view for a single series. Clients render their status line
        from this, and read `lastCodeIssuedAt` / `lastGameAt` to detect a game
        that was played but never reported.
      operationId: getSeries
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The series, with its tournament codes and games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesWithGamesDto"
        "404":
          description: Series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/game:
    post:
      summary: Issue a tournament code for a series
      description: |
        Issues a new Riot tournament code. This is **never** blocked — not by
        the series being complete, and not by a previous game going
        unreported. Players must never be prevented from playing, so the worst
        case here is a wasted code.

        A replacement for a code that did not work is simply another call to
        this endpoint. There is no void step: a code with no result does not
        count towards the game number.
      operationId: createGame
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameDto"
      responses:
        "201":
          description: |
            Tournament code issued.

            Note this replaces the previous `GameDto` response. A freshly
            issued code has no game number, because no game has been played
            on it yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentCodeDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            Riot could not issue a code. Retryable — Riot returned 429 or 5xx.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/results:
    post:
      summary: Report the result of a game
      description: |
        The single result-reporting entry point, used by both self-serve and
        staff. Recording a result triggers the automatic completion check: if
        one team has more than `totalGames / 2` wins, the series is closed.

        Idempotent. If the targeted code already has a result, the existing
        game is returned and nothing is double-counted.
      operationId: reportSeriesResult
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResultDto"
      responses:
        "201":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "200":
          description: |
            The target already had a result. The existing game is returned and
            nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "404":
          description: Series or tournament code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            A game with this Riot match id is already recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Invalid combination of fields.

            Possible reasons:
            - Both `tournamentCodeId` and `shortcode` were given.
            - No winner was named and Riot has no record of the game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/complete:
    post:
      summary: Complete a series
      description: |
        Manually close a series. Also the forfeit path — a forfeit is a
        completion with a winner and zero games played.
      operationId: completeSeries
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSeriesDto"
      responses:
        "200":
          description: Series completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDto"
        "404":
          description: Series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid input, for example a winner that is not in this series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Reopen a completed series
      description: |
        Staff-only insurance against Denny's closing a series wrongly. Clears
        `completed` and `completedAt` and stamps a reopen timestamp, which
        suppresses the automatic completion check so the series does not slam
        shut again on the next recorded result. Existing results are preserved.
      operationId: reopenSeries
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Series reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDto"
        "404":
          description: Series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Team Endpoints
  /api/v1/team:
    get:
      summary: Get all teams
      operationId: getTeams
      tags:
        - Teams (v1)
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter teams matching this name. Partial completions are allowed.
      responses:
        "200":
