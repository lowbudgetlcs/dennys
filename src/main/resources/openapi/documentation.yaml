openapi: 3.0.3
info:
  title: Dennys - OpenAPI 3.0
  description: |-
    This is the Dennys OpenAPI 3.0 specification.
  contact:
    email: lblcs.dev@gmail.com
  license:
    name: MIT
    url: https://github.com/lowbudgetlcs/dennys/blob/main/LICENSE.txt
  version: 1.3.1
externalDocs:
  description: Find out more about Dennys
  url: https://github.com/lowbudgetlcs/dennys
servers:
  - url: /

tags:
  - name: Authentication
  - name: Event Groups (v1)
    description: Manage event groups
  - name: Events (v1)
    description: Manage Event
  - name: Series (v1)
    description: Create games inside of a series
  - name: Teams (v1)
    description: Manage teams
  - name: Players (v1)
    description: Manage players
  - name: Accounts (v1)
    description: Manage riot accounts

paths:
  /login:
    post:
      summary: Start a session with username/password.
      operationId: login
      tags:
        - Authentication
      requestBody:
        description: Valid credentials
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "201":
          description: >
            Successfully authenticated.
            The session identifier is returned in a cookie named `user-session`.
            This cookie must be included in subsequent requests.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "user-session=%7B%22id%22%3A%226c61476b-da90-4cae-82e3-cf009e628f3e%22%2C%22userId%22%3A1%2C%22expiresAt%22%3A%222026-01-04T04%3A55%3A06.154275Z%22%7D; Max-Age=10800; Expires=Sun, 04 Jan 2026 06:55:06 GMT; Path=/; Secure; HttpOnly; SameSite=strict; $x-enc=URI_ENCODING"
        "401":
          description: Failed to authenticate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

      security: []
  /logout:
    post:
      security:
        - cookieAuth: []
      description: Removes the currently active session.
      operationId: logout
      tags:
        - Authentication
      responses:
        "200":
          description: Successfully deleted active session.
        "401":
          description: Failed to authenticate, no active session found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /createToken:
    post:
      security:
        - cookieAuth: []
      description: Create an API token for the currently logged-in user.
      operationId: createToken
      tags:
        - Authentication
      requestBody:
        description: Token parameters.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenDto"
      responses:
        "201":
          description: Successfully created token.
          content:
            text/plain:
              schema:
                type: string
                example: ABCDEFG123456
        "401":
          description: Failed to authenticate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



  # Event Group Endpoints
  /api/v1/eventGroup:
    get:
      summary: Get all event groups
      operationId: getEventGroups
      tags:
        - Event Groups (v1)
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventGroupDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a new event group
      operationId: createEventGroup
      tags:
        - Event Groups (v1)
      requestBody:
        description: Event group specification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventGroupDto"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - One of the events in eventIds is already in another event group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}:
    get:
      summary: Get an event group by ID
      operationId: getEventGroupById
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Event group found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Patch an event group's data
      operationId: patchEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group to update
          schema:
            type: integer
      requestBody:
        required: true
        description: Fields to update on the event group
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventGroupDto"
      responses:
        "200":
          description: Event group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}/events:
    get:
      summary: Get an event group with all events included
      operationId: getEventsInEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group
          schema:
            type: integer
      responses:
        "200":
          description: List of events in the event group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventGroupWithEventsDto"
        "404":
          description: Event group not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add an event to an event group
      operationId: addEventToEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventGroupAddEventDto"
      responses:
        "200":
          description: Event added to event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupWithEventsDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event group or event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}/events/{eventId}:
    delete:
      summary: Remove an event from an event group
      operationId: removeEventFromEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event removed from event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupWithEventsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Event Endpoints
  /api/v1/event:
    get:
      tags:
        - Events (v1)
      summary: Get all events
      description: Fetch a list of all events.
      operationId: getEvents
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter events matching this name. Partial completions are allowed.
        - in: query
          name: status
          schema:
            allOf:
              - description: The intended starting status of the event.
              - example: NOT_STARTED
              - $ref: "#/components/schemas/EventStatus"
          description: Filter only series in this event stage.

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Events (v1)
      summary: Create a new event.
      description: |
        Registers an event with Dennys, and optionally assign it to an event group
      operationId: addEvent
      requestBody:
        description: Event specification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventDto"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}:
    get:
      tags:
        - Events (v1)
      summary: Get an event by ID.
      description: Returns a single event with the associated teams.
      operationId: getEventById
      parameters:
        - name: eventId
          in: path
          description: ID of event to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Missing or malformed id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Events (v1)
      summary: Patch an event's data
      parameters:
        - name: eventId
          in: path
          description: ID of event to update
          required: true
          schema:
            type: integer
            format: int64
      operationId: patchEvent
      requestBody:
        required: true
        description: Patch existing event.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventDto"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/teams:
    get:
      summary: Get an event with all teams included
      operationId: getTeamsInEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
      responses:
        "200":
          description: List of teams in the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Link a team to an event
      operationId: addTeamToEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventAddTeamDto"
      responses:
        "200":
          description: Team added to event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - Team is already assigned to a different event
            - One or more players on this team are already assigned to a different team in this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/teams/{teamId}:
    delete:
      summary: Remove a team from an event
      operationId: removeTeamFromEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team removed from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Series Endpoints
  /api/v1/event/{eventId}/series:
    get:
      summary: Get all the series of an event
      operationId: getSeriesInEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
        - in: query
          name: teamIds
          schema:
            type: array
            items:
              type: integer
              uniqueItems: true
          description: |
            Filter only series with these teamIds (more than 2 
            teams guaruntees an empty array).
        - in: query
          name: stage
          schema:
            type: string
            example: REGULAR_SEASON
          description: Filter only series in this event stage.
      responses:
        "200":
          description: List of series in the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithSeriesDto"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a series for an event.
      operationId: addSeriesToEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesDto"
      responses:
        "200":
          description: Team added to event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDto"
        "400":
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - One or more teams are not in this event.
            - Series already exists between these teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/series/{seriesId}:
    delete:
      summary: Remove a series from an event
      operationId: removeSeriesFromEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Series removed from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSeriesDto"
        "404":
          description: Event or series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/game:
    post:
      summary: Create a game in a series
      operationId: createGame
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameDto"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Team Endpoints
  /api/v1/team:
    get:
      summary: Get all teams
      operationId: getTeams
      tags:
        - Teams (v1)
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a new team
      operationId: addTeam
      tags:
        - Teams (v1)
      requestBody:
        required: true
        description: New team details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTeamDto"
      responses:
        "200":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/team/{teamId}:
    get:
      summary: Get a team by ID
      operationId: getTeamById
      tags:
        - Teams (v1)
      parameters:
        - name: teamId
          in: path
          required: true
          description: ID of the team
          schema:
            type: integer
      responses:
        "200":
          description: Team found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDto"
        "404":
          description: Team not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Patch a team's data.
      operationId: patchTeam
      tags:
        - Teams (v1)
      parameters:
        - name: teamId
          in: path
          required: true
          description: ID of the team to update
          schema:
            type: integer
      requestBody:
        required: true
        description: Fields to update for the team
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTeamDto"
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Team not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/team/{teamId}/players:
    get:
      summary: Get a team with all the players included
      operationId: getPlayersOnTeam
      tags:
        - Teams (v1)
      parameters:
        - name: teamId
          in: path
          required: true
          description: ID of the team
          schema:
            type: integer
      responses:
        "200":
          description: Players on the team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamWithPlayersDto"
        "404":
          description: Team not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add a player to a team
      operationId: addPlayerToTeam
      tags:
        - Teams (v1)
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamPlayerLinkRequestDto"
      responses:
        "200":
          description: Player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithPlayersDto"
        "404":
          description: Team or player not found
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - Player is already assigned to a different team in this event
            - Player is already assigned to this team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/team/{teamId}/players/{playerId}:
    delete:
      summary: Remove a player from a team
      operationId: removePlayerFromTeam
      tags:
        - Teams (v1)
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithPlayersDto"
        "404":
          description: Team or player not found

  # Player Endpoints
  /api/v1/player:
    get:
      summary: Get all players
      operationId: getPlayers
      tags:
        - Players (v1)
      responses:
        "200":
          description: List of all players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a new player
      operationId: addPlayer
      tags:
        - Players (v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPlayerDto"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "400":
          description: Name field is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Player name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/player/{playerId}:
    get:
      summary: Get player by ID
      operationId: getPlayerById
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "404":
          description: Player not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Patch a player's data
      operationId: patchPlayer
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player to rename
          schema:
            type: integer
      requestBody:
        required: true
        description: Updated player data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPlayerDto"
      responses:
        "200":
          description: Player renamed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Player not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/player/{playerId}/accounts:
    post:
      summary: Link a Riot account to a player
      operationId: linkAccountToPlayer
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLinkRequestDto"
      responses:
        "200":
          description: Riot account linked to player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "400":
          description: Invalid input
        "404":
          description: Player or Riot account not found
        "409":
          description: Riot account already assigned to another player
        default:
          description: Unexpected error
  /api/v1/player/{playerId}/accounts/{accountId}:
    delete:
      summary: Remove a Riot account from a player
      operationId: removeAccountFromPlayer
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player
          schema:
            type: integer
        - name: accountId
          in: path
          required: true
          description: ID of the Riot account to remove
          schema:
            type: integer
      responses:
        "200":
          description: Riot account removed from player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "404":
          description: Player or account not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Account Endpoints
  /api/v1/account:
    get:
      summary: Get all Riot accounts
      operationId: getAllRiotAccounts
      tags:
        - Accounts (v1)
      responses:
        "200":
          description: List of all Riot accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiotAccountDto"
        default:
          description: Unexpected error
    post:
      summary: Create a new Riot account
      operationId: createRiotAccountDto
      tags:
        - Accounts (v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRiotAccountDto"
      responses:
        "201":
          description: Riot account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiotAccountDto"
        "400":
          description: Invalid PUUID format
        "404":
          description: Riot account not found from Riot API
        "409":
          description: Riot account already exists
        default:
          description: Unexpected error
  /api/v1/account/{accountId}:
    get:
      summary: Get Riot account by ID
      operationId: getRiotAccountDtoById
      tags:
        - Accounts (v1)
      parameters:
        - name: accountId
          in: path
          required: true
          description: Internal database ID of the Riot account
          schema:
            type: integer
      responses:
        "200":
          description: Riot account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiotAccountDto"
        "404":
          description: Riot account not found
        default:
          description: Unexpected error

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user-session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    # Enums
    EventStatus:
      type: string
      enum:
        - NOT_STARTED
        - ACTIVE
        - CANCELED
        - PAUSED
        - COMPLETED
    EventStage:
      type: string
      enum:
        - REGULAR_SEASON
        - PLAYOFFS
        - PROMOTION_RELEGATION

    # Auth Schemas
    LoginDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ruuffian
        password:
          type: string
          example: changeit

    CreateTokenDto:
      type: object
      required:
        - name
        - expiresAt
        - scopes
      properties:
        name:
          type: string
          example: Test token
        expiresAt:
          type: string
          format: date-time
          example: "2025-08-22T15:34:23.105Z"
        scopes:
          type: string
          example: 'user,admin'


    # Game Schemas
    GameDto:
      type: object
      required:
        - id
        - shortcode
        - blueTeamId
        - redTeamId
        - seriesId
        - number
      properties:
        id:
          type: integer
        shortcode:
          type: string
          example: NA04eff-c5b0b774-c049-47cf-88f4-eee05c8d83ae
        blueTeamId:
          type: integer
          example: 2
        redTeamId:
          type: integer
          example: 4
        seriesId:
          type: integer
          example: 3
        number:
          type: integer
          example: 1

    CreateGameDto:
      type: object
      required:
        - blueTeamId
        - redTeamId
      properties:
        blueTeamId:
          type: integer
        redTeamId:
          type: integer

    # Event Group Schemas
    CreateEventGroupDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Season 14
        eventIds:
          type: array
          items:
            type: integer
          nullable: true
          example: []

    EventGroupDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 0
        name:
          type: string
          example: Season 14 Regular Season

    EventGroupWithEventsDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Season 14 Regular Season
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventDto"

    PatchEventGroupDto:
      type: object
      description: Fields to update on an event group
      properties:
        name:
          type: string
          example: Season 14 But New

    EventGroupAddEventDto:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: integer
          example: 123

    # Event Schemas
    CreateEventDto:
      type: object
      required:
        - name
        - startDate
        - endDate
        - status
        - eventStages
      properties:
        name:
          type: string
          example: Season 14 Commercial
        description:
          type: string
          description: Describe the event!
          example: Season 14's plat-emerald league!
        startDate:
          type: string
          format: date-time
          example: "2025-08-22T15:34:23.105Z"
        endDate:
          type: string
          format: date-time
          example: "2025-08-27T15:34:23.105Z"
        status:
          allOf:
            - description: The intended starting status of the event.
            - example: NOT_STARTED
            - $ref: "#/components/schemas/EventStatus"
        eventStages:
          type: array
          items:
            allOf:
              - description: The valid stages of the event.
              - $ref: "#/components/schemas/EventStage"

    EventDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - eventStages
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: Event name
          example: Season 14 Commercial
        description:
          type: string
          example: Season 14's plat-emerald league!
        createdAt:
          type: string
          format: date-time
          example: "2025-08-21T15:34:23.105Z"
        startDate:
          type: string
          format: date-time
          example: "2025-08-22T15:34:23.105Z"
        endDate:
          type: string
          format: date-time
          example: "2025-08-27T15:34:23.105Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 1
          nullable: true
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    EventWithTeamsDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - teams
        - eventStages
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Season 15 Audit
        description:
          type: string
          example: The Season 15 plat-emerald league!
        createdAt:
          type: string
          format: date-time
          example: "2025-08-21T15:34:23.105Z"
        startDate:
          type: string
          format: date-time
          example: "2025-08-22T15:34:23.105Z"
        endDate:
          type: string
          format: date-time
          example: "2025-08-27T15:34:23.105Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 1
          nullable: true
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    EventWithSeriesDto:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - startDate
        - endDate
        - status
        - eventGroupId
        - series
        - eventStages
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Season 15 Audit
        description:
          type: string
          example: The Season 15 plat-emerald league!
        createdAt:
          type: string
          format: date-time
          example: "2025-08-21T15:34:23.105Z"
        startDate:
          type: string
          format: date-time
          example: "2025-08-22T15:34:23.105Z"
        endDate:
          type: string
          format: date-time
          example: "2025-08-27T15:34:23.105Z"
        status:
          allOf:
            - $ref: "#/components/schemas/EventStatus"
            - description: The current event status.
            - example: NOT_STARTED
        eventGroupId:
          type: integer
          example: 1
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDto"
        eventStages:
          type: array
          items:
            $ref: "#/components/schemas/EventStage"

    PatchEventDto:
      type: object
      properties:
        name:
          type: string
          description: Event name
          example: Season 14 Commercial
        description:
          type: string
          example: Season 14's plat-emerald league!
        startDate:
          type: string
          format: date-time
          example: "2025-08-22T15:34:23.105Z"
        endDate:
          type: string
          format: date-time
          example: "2025-08-27T15:34:23.105Z"
        status:
          allOf:
            - description: The new event status.
            - example: CANCELED
            - $ref: "#/components/schemas/EventStatus"

    EventAddTeamDto:
      type: object
      required:
        - teamId
      properties:
        teamId:
          type: integer
          example: 3

    CreateSeriesDto:
      type: object
      required:
        - team1Id
        - team2Id
        - totalGames
        - stage
      properties:
        team1Id:
          type: integer
          example: 1
        team2Id:
          type: integer
          example: 1
        totalGames:
          type: integer
          example: 3
        stage:
          type: string
          example: REGULAR_SEASON

    # Player Schemas
    NewPlayerDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: ruuffian#FUNZ

    PlayerDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/RiotAccountDto"

    AccountLinkRequestDto:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: integer

    PatchPlayerDto:
      type: object
      properties:
        name:
          type: string
          description: New player name (not necessarily a Riot ID)
          example: newname

    # Riot Account Schemas
    NewRiotAccountDto:
      type: object
      required:
        - riotPuuid
      properties:
        riotPuuid:
          type: string
          description: Riot's permanent unique user ID (78 chars)

    RiotAccountDto:
      type: object
      required:
        - id
        - riotPuuid
      properties:
        id:
          type: integer
        riotPuuid:
          type: string
          description: Riot's permanent unique user ID (78 chars)
        playerId:
          type: integer
          nullable: true

    # Team Schemas
    NewTeamDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Golden Guardians
        logo:
          type: string
          example: https://google.com
        eventId:
          type: integer
          example: 1
          nullable: true

    PatchTeamDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          example: Golden Guardians Rebranded
        logo:
          type: string
          example: https://google.com

    TeamDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
        eventId:
          type: integer
          nullable: true

    TeamWithPlayersDto:
      type: object
      required:
        - id
        - name
        - players
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
        eventId:
          type: integer
          nullable: true
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerDto"

    TeamPlayerLinkRequestDto:
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: integer

    # Series Schema
    SeriesDto:
      type: object
      required:
        - id
        - eventId
        - teams
        - totalGames
      properties:
        id:
          type: integer
        eventId:
          type: integer
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"
        totalGames:
          type: integer

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      required:
        - code
        - message

security:
  - cookieAuth: []
  - bearerAuth: []
