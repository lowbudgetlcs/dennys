          example: 88
        seriesId:
          type: integer
          example: 42
        eventId:
          type: integer
          example: 12
        eventGroupId:
          type: integer
          nullable: true
          example: 16
        stage:
          $ref: "#/components/schemas/EventStage"
        teamId:
          type: integer
          nullable: true
          description: From the game result, or the code's side when there is none.
          example: 7
        side:
          type: string
          nullable: true
          enum:
            - BLUE
            - RED
        gameDurationSeconds:
          type: integer
          example: 1834
        win:
          type: boolean
        firstBlood:
          type: boolean
        firstTower:
          type: boolean
        firstDragon:
          type: boolean
        firstBaron:
