          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Player name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/player/{playerId}:
    get:
      summary: Get player by ID
      operationId: getPlayerById
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "404":
          description: Player not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Patch a player's data
      operationId: patchPlayer
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player to rename
          schema:
            type: integer
      requestBody:
        required: true
        description: Updated player data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPlayerDto"
      responses:
        "200":
          description: Player renamed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Player not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/player/{playerId}/teams:
    get:
      summary: Get player by ID with teams
      operationId: getPlayerByIdWithTeams
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerWithTeamsDto"
        "404":
          description: Player not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/player/{playerId}/accounts:
    post:
      summary: Link a Riot account to a player
      operationId: linkAccountToPlayer
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLinkRequestDto"
      responses:
        "200":
          description: Riot account linked to player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "400":
          description: Invalid input
        "404":
          description: Player or Riot account not found
        "409":
          description: Riot account already assigned to another player
        default:
          description: Unexpected error
  /api/v1/player/{playerId}/accounts/{accountId}:
    delete:
      summary: Remove a Riot account from a player
      operationId: removeAccountFromPlayer
      tags:
        - Players (v1)
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID of the player
          schema:
            type: integer
        - name: accountId
          in: path
          required: true
          description: ID of the Riot account to remove
          schema:
            type: integer
      responses:
        "200":
          description: Riot account removed from player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "404":
          description: Player or account not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Account Endpoints
  /api/v1/account:
    get:
      summary: Get all Riot accounts
      operationId: getAllRiotAccounts
      tags:
        - Accounts (v1)
      responses:
        "200":
          description: List of all Riot accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiotAccountDto"
        default:
          description: Unexpected error
    post:
      summary: Create a new Riot account
      operationId: createRiotAccountDto
      tags:
        - Accounts (v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRiotAccountDto"
      responses:
        "201":
          description: Riot account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiotAccountDto"
        "400":
          description: Malformed request body
        "422":
          description: |
            Invalid PUUID. A PUUID must be exactly 78 base64url characters
            (letters, digits, '-' and '_'); anything else is rejected before
            Riot is called. Riot rejecting the value also surfaces here.
        "404":
          description: Riot account not found from Riot API
        "409":
          description: Riot account already exists
        default:
          description: Unexpected error
  /api/v1/account/{accountId}:
    get:
      summary: Get Riot account by ID
      operationId: getRiotAccountDtoById
      tags:
        - Accounts (v1)
      parameters:
        - name: accountId
          in: path
          required: true
          description: Internal database ID of the Riot account
          schema:
            type: integer
      responses:
        "200":
          description: Riot account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiotAccountDto"
        "404":
          description: Riot account not found
        default:
          description: Unexpected error

components:
  parameters:
    StatsEventGroupId:
      in: query
      name: eventGroupId
      schema:
        type: integer
      description: Only games in this event group (season).
    StatsEventId:
      in: query
      name: eventId
      schema:
        type: integer
      description: Only games in this event.
    StatsStage:
      in: query
      name: stage
      schema:
        $ref: "#/components/schemas/EventStage"
      description: Only games of series in this stage.
    StatsTeamId:
      in: query
      name: teamId
      schema:
        type: integer
      description: Only rows for this team.
    StatsMinDurationSeconds:
      in: query
      name: minDurationSeconds
      schema:
        type: integer
      description: Only games at least this long, in seconds. Use it to leave out remakes.
    StatsLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    StatsOffset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Unauthorized:
      description: |
        No valid session cookie or bearer token was supplied. Applies to every
        operation under `/api/v1`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: |
        The request carried a body without `Content-Type: application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user-session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    # Enums
    EventStatus:
      type: string
      enum:
        - NOT_STARTED
        - ACTIVE
        - CANCELED
        - PAUSED
        - COMPLETED
    EventStage:
      type: string
      enum:
        - REGULAR_SEASON
        - PLAYOFFS
    SeriesStatus:
      type: string
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - COMPLETE
        - CANCELLED

    # Auth Schemas
    LoginDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ruuffian
        password:
          type: string
          example: changeit

    CreateTokenDto:
      type: object
      required:
        - name
        - expiresAt
        - scopes
      properties:
        name:
          type: string
          example: todd-bot
        expiresAt:
          type: string
          format: date-time
          example: "2027-01-01T00:00:00.000Z"
        scopes:
          type: string
          description: Colon-delimited scope list.
          example: 'user:admin'


    # Game Schemas
    TournamentCodeDto:
      type: object
      description: |
        A tournament code issued by Riot for a series. A code may back zero
        games — it can be issued and never played — so codes are counted
        separately from games.
      required:
        - id
        - shortcode
        - seriesId
        - blueTeamId
        - redTeamId
        - createdAt
      properties:
        id:
          type: integer
          example: 117
        shortcode:
          type: string
          example: NA04eff-c5b0b774-c049-47cf-88f4-eee05c8d83ae
        seriesId:
          type: integer
          example: 42
        blueTeamId:
          type: integer
          example: 7
        redTeamId:
          type: integer
          example: 12
        createdAt:
          type: string
          format: date-time
          example: "2026-07-14T22:58:31.204Z"

    GameDto:
      type: object
      description: |
        A game that was actually played. `tournamentCodeId` and `riotMatchId`
        are null for a custom game played without a code — Riot cannot serve
        custom match data, so those are recorded from a self-reported result.
        `number` is derived as one past the highest number in the series, so a
        code that is never played does not consume a game number.
      required:
        - id
        - seriesId
        - number
        - createdAt
      properties:
        id:
          type: integer
          example: 88
        seriesId:
          type: integer
          example: 42
        tournamentCodeId:
          type: integer
          nullable: true
          description: Null when the game was played without a tournament code.
          example: 117
        riotMatchId:
          type: string
          nullable: true
          description: "`{platformId}_{gameId}`. Null when there is no Riot record."
          example: NA1_5102531894
        number:
          type: integer
          description: Position within the series.
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-07-14T23:12:04.318Z"
        result:
          type: object
          nullable: true
          description: Null until a result has been recorded.
          allOf:
            - $ref: "#/components/schemas/GameResultDto"

    GameResultDto:
      type: object
      required:
        - winningTeamId
        - losingTeamId
      properties:
        winningTeamId:
          type: integer
          example: 7
        losingTeamId:
          type: integer
          example: 12

    GameStatsDto:
      type: object
      required:
        - players
        - teams
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameStatsDto"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamGameStatsDto"

    PlayerGameStatsDto:
      type: object
      description: |
        One participant in one game. Numbers Riot leaves out of the payload
        read as 0.
      required:
        - gameId
        - seriesId
        - eventId
        - stage
        - gameDurationSeconds
        - championId
        - win
        - kills
        - deaths
        - assists
        - cs
        - goldEarned
        - champLevel
        - damageToChampions
        - damageTaken
        - visionScore
        - wardsPlaced
        - wardsKilled
        - controlWardsBought
        - voidGrubs
      properties:
        gameId:
          type: integer
          example: 88
        seriesId:
          type: integer
          example: 42
        eventId:
          type: integer
          example: 12
        eventGroupId:
          type: integer
          nullable: true
          example: 16
        stage:
          $ref: "#/components/schemas/EventStage"
        teamId:
          type: integer
          nullable: true
          description: From the game result, or the code's side when there is none.
          example: 7
        playerId:
          type: integer
          nullable: true
          description: Null when the PUUID isn't linked to a player.
          example: 31
        gameDurationSeconds:
          type: integer
          example: 1834
        puuid:
          type: string
          nullable: true
        riotIdGameName:
          type: string
          nullable: true
          example: Faker
        riotIdTagline:
          type: string
          nullable: true
          example: KR1
        championId:
          type: integer
          example: 103
        championName:
          type: string
          nullable: true
          example: Ahri
        position:
          type: string
          nullable: true
          example: MIDDLE
        win:
          type: boolean
        kills:
          type: integer
        deaths:
          type: integer
        assists:
          type: integer
        cs:
          type: integer
          description: Lane and jungle minions.
        goldEarned:
          type: integer
        champLevel:
          type: integer
        damageToChampions:
          type: integer
        damageTaken:
          type: integer
        visionScore:
          type: integer
        wardsPlaced:
          type: integer
        wardsKilled:
          type: integer
        controlWardsBought:
          type: integer
        voidGrubs:
          type: integer

    TeamGameStatsDto:
      type: object
      description: |
        One side in one game. Objectives Riot leaves out of the payload read
        as 0 or false.
      required:
        - gameId
        - seriesId
        - eventId
        - stage
        - gameDurationSeconds
        - win
        - firstBlood
        - firstTower
        - firstDragon
        - firstBaron
        - kills
        - towerKills
        - inhibitorKills
        - dragonKills
        - baronKills
        - riftHeraldKills
        - hordeKills
        - bans
