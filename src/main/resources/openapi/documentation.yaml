openapi: 3.0.3
info:
  title: Dennys - OpenAPI 3.0
  description: |-
    This is the Dennys OpenAPI 3.0 specification.
  contact:
    email: lblcs.dev@gmail.com
  license:
    name: MIT
    url: https://github.com/lowbudgetlcs/dennys/blob/main/LICENSE.txt
  version: 1.5.0
externalDocs:
  description: Find out more about Dennys
  url: https://github.com/lowbudgetlcs/dennys
servers:
  - url: /

tags:
  - name: Authentication
  - name: Event Groups (v1)
    description: Manage event groups
  - name: Events (v1)
    description: Manage Event
  - name: Series (v1)
    description: Create games inside of a series
  - name: Games (v1)
    description: Riot match data and stats for a played game
  - name: Stats (v1)
    description: Stats rows across games
  - name: Teams (v1)
    description: Manage teams
  - name: Players (v1)
    description: Manage players
  - name: Accounts (v1)
    description: Manage riot accounts

paths:
  /login:
    post:
      summary: Start a session with username/password.
      operationId: login
      tags:
        - Authentication
      requestBody:
        description: Valid credentials
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "201":
          description: >
            Successfully authenticated.
            The session identifier is returned in a cookie named `user-session`.
            This cookie must be included in subsequent requests.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "user-session=%7B%22id%22%3A%226c61476b-da90-4cae-82e3-cf009e628f3e%22%2C%22userId%22%3A1%2C%22expiresAt%22%3A%222026-01-04T04%3A55%3A06.154275Z%22%7D; Max-Age=10800; Expires=Sun, 04 Jan 2026 06:55:06 GMT; Path=/; Secure; HttpOnly; SameSite=strict; $x-enc=URI_ENCODING"
        "401":
          description: Failed to authenticate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

      security: [ ]
  /logout:
    post:
      summary: End the current session.
      security:
        - cookieAuth: [ ]
      description: Removes the currently active session.
      operationId: logout
      tags:
        - Authentication
      responses:
        "200":
          description: Successfully deleted active session.
        "401":
          description: Failed to authenticate, no active session found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /createToken:
    post:
      summary: Issue an API token for the current user.
      security:
        - cookieAuth: [ ]
      description: |
        Create an API token for the currently logged-in user. The token is
        returned in plaintext exactly once — only its hash is stored.
      operationId: createToken
      tags:
        - Authentication
      requestBody:
        description: Token parameters.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenDto"
      responses:
        "201":
          description: Successfully created token.
          content:
            text/plain:
              schema:
                type: string
                example: ABCDEFG123456
        "401":
          description: Failed to authenticate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"



  # Event Group Endpoints
  /api/v1/eventGroup:
    get:
      summary: Get all event groups
      operationId: getEventGroups
      tags:
        - Event Groups (v1)
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventGroupDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a new event group
      operationId: createEventGroup
      tags:
        - Event Groups (v1)
      requestBody:
        description: Event group specification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventGroupDto"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - One of the events in eventIds is already in another event group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}:
    get:
      summary: Get an event group by ID
      operationId: getEventGroupById
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Event group found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Patch an event group's data
      operationId: patchEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group to update
          schema:
            type: integer
      requestBody:
        required: true
        description: Fields to update on the event group
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventGroupDto"
      responses:
        "200":
          description: Event group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}/events:
    get:
      summary: Get an event group with all events included
      operationId: getEventsInEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          description: ID of the event group
          schema:
            type: integer
      responses:
        "200":
          description: List of events in the event group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventGroupWithEventsDto"
        "404":
          description: Event group not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add an event to an event group
      operationId: addEventToEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventGroupAddEventDto"
      responses:
        "200":
          description: Event added to event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupWithEventsDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event group or event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/eventGroup/{eventGroupId}/events/{eventId}:
    delete:
      summary: Remove an event from an event group
      operationId: removeEventFromEventGroup
      tags:
        - Event Groups (v1)
      parameters:
        - name: eventGroupId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event removed from event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupWithEventsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Event Endpoints
  /api/v1/event:
    get:
      tags:
        - Events (v1)
      summary: Get all events
      description: Fetch a list of all events.
      operationId: getEvents
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter events matching this name. Partial completions are allowed.
        - in: query
          name: status
          schema:
            allOf:
              - description: The intended starting status of the event.
              - example: NOT_STARTED
              - $ref: "#/components/schemas/EventStatus"
          description: Filter only series in this event stage.

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDto"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Events (v1)
      summary: Create a new event.
      description: |
        Registers an event with Dennys, and optionally assign it to an event group
      operationId: addEvent
      requestBody:
        description: Event specification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventDto"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}:
    get:
      tags:
        - Events (v1)
      summary: Get an event by ID.
      description: Returns a single event with the associated teams.
      operationId: getEventById
      parameters:
        - name: eventId
          in: path
          description: ID of event to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Missing or malformed id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Events (v1)
      summary: Patch an event's data
      parameters:
        - name: eventId
          in: path
          description: ID of event to update
          required: true
          schema:
            type: integer
            format: int64
      operationId: patchEvent
      requestBody:
        required: true
        description: Patch existing event.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventDto"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/teams:
    get:
      summary: Get an event with all teams included
      operationId: getTeamsInEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
      responses:
        "200":
          description: List of teams in the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Link a team to an event
      operationId: addTeamToEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventAddTeamDto"
      responses:
        "200":
          description: Team added to event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - Team is already assigned to a different event
            - One or more players on this team are already assigned to a different team in this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/teams/{teamId}:
    delete:
      summary: Remove a team from an event
      operationId: removeTeamFromEvent
      tags:
        - Events (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team removed from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithTeamsDto"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Series Endpoints
  /api/v1/event/{eventId}/series:
    get:
      summary: Get all the series of an event
      operationId: getSeriesInEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
        - in: query
          name: teamIds
          schema:
            type: array
            items:
              type: integer
              uniqueItems: true
          description: |
            Filter only series with these teamIds (more than 2 
            teams guaruntees an empty array).
        - in: query
          name: stage
          schema:
            type: string
            example: REGULAR_SEASON
          description: Filter only series in this event stage.
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/SeriesStatus"
          description: |
            Filter on series status. Omitting the parameter returns series in
            every status.
      responses:
        "200":
          description: The event, with the series matching the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSeriesDto"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a series for an event.
      operationId: addSeriesToEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesDto"
      responses:
        "201":
          description: Series created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDto"
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Event or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Invalid resource state

            Possible reasons:
            - One or more teams are not in this event.

            Note that repeat series between the same two teams are supported —
            two teams may legitimately meet more than once inside one stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            Validation failed.

            Possible reasons:
            - `totalGames` is not greater than zero.
            - `stage` is not a valid `EventStage`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/event/{eventId}/series/{seriesId}:
    delete:
      summary: Remove a series from an event
      operationId: removeSeriesFromEvent
      tags:
        - Series (v1)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Series removed from event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSeriesDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Event not found, series not found, or the series is not part of
            this event. A series may only be deleted through the event it
            belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The series has tournament codes or games recorded against it and
            cannot be deleted. A tournament code is a real Riot artifact and
            may already have player stats keyed on its shortcode. Complete the
            series instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}:
    get:
      summary: Get a series with its tournament codes and games
      description: |
        The status view for a single series. Clients render their status line
        from this, and read `lastCodeIssuedAt` / `lastGameAt` to detect a game
        that was played but never reported.
      operationId: getSeries
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The series, with its tournament codes and games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesWithGamesDto"
        "404":
          description: Series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Set a series' status and result
      description: |
        Sets the status by hand, and for `COMPLETE` the result.

        - A winner records the result. With no games played, that is a forfeit.
        - `doubleLoss: true` records a loss for both teams with no winner
          (rulebook §5.5.2). A series can never have both.
        - `COMPLETE` with neither keeps any result already stored.
        - Any other status clears the stored result.

        A complete series can be patched again to correct its result.
      operationId: patchSeries
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSeriesDto"
      responses:
        "200":
          description: Series updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            Invalid combination of fields.

            Possible reasons:
            - Both `winnerTeamId` and `doubleLoss: true` were given.
            - `winnerTeamId` or `doubleLoss` was given with a status other than `COMPLETE`.
            - `winnerTeamId` is not a participant in the series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/game:
    post:
      summary: Issue a tournament code for a series
      description: |
        Issues a Riot tournament code for the series' current game.

        Idempotent by default: if a code has already been issued since the
        most recent recorded game, that code is returned with `200` and Riot is
        not called, so two captains pressing at once share one code. Send
        `newCode: true` to issue another one deliberately, for example to
        replace a code that did not work.

        A series may be issued at most **2 codes per game**, counted since the
        most recent recorded game. Recording a result ends the current game and
        grants a fresh 2 for the next; unused allowance does not roll over. The
        limit exists to bound calls to Riot, not to control play — a refused
        request never reaches Riot at all.

        Being at the limit does not prevent anyone from playing. Report the
        result of the game that was played, or play a custom game and report
        the winner; either records a game, which resets the allowance. A
        codeless result from a custom game resets it just as a coded one does.

        The first code issued moves a `NOT_STARTED` series to `IN_PROGRESS`.
        Issuance is still not blocked by the series being complete, and a
        replacement for a code that did not work is another call to this
        endpoint with `newCode: true`. There is no void step: a code with no result does not count
        towards the game number, though it does count towards the limit — so a
        replacement for a bum code spends the second of the two, and the next
        step after that is a custom game.
      operationId: createGame
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameDto"
      responses:
        "200":
          description: |
            A code was already issued since the most recent recorded game, and
            `newCode` was not set. That code is returned; Riot was not called.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentCodeDto"
        "201":
          description: |
            Tournament code issued.

            Note this replaces the previous `GameDto` response. A freshly
            issued code has no game number, because no game has been played
            on it yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentCodeDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Series or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The series already holds the maximum of 2 tournament codes for the
            current game. Riot was not called. The body's `reason` is
            `CODE_LIMIT`.

            Record a result to reset the allowance — either report the game
            that was played, or play a custom game and report the winner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            Riot rejected the request in a way that will not succeed on a
            retry, for example a bad or unauthorised API key. Do not retry;
            fall back to a custom game if a code is needed to play.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Riot could not be reached, or rate-limited us (429 or 5xx). The
            request is worth retrying shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: |
            The series has no parent event, Riot returned an empty list of
            codes, or the code could not be persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/results:
    post:
      summary: Report the result of a game
      description: |
        The single result-reporting entry point, used by both self-serve and
        staff. Records the reported winner; Riot is never called. Recording a
        result triggers the automatic completion check: if one team has more
        than `totalGames / 2` wins, the series is closed.

        Idempotent per tournament code, including concurrent reports. If the
        targeted code already has a result, the existing game is returned and
        nothing is double-counted.

        A report on a `COMPLETE` or `CANCELLED` series, including a double
        loss, records the game and leaves the series' status and result alone.
      operationId: reportSeriesResult
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResultDto"
      responses:
        "201":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "200":
          description: |
            The targeted code already had a result. The existing game is
            returned and nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Series not found, the tournament code was not found, or the code
            belongs to a different series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            Invalid combination of fields.

            Possible reasons:
            - Both `tournamentCodeId` and `shortcode` were given.
            - `winnerTeamId` is missing.
            - `winnerTeamId` is not a participant in the series.
            - `loserTeamId` contradicts `winnerTeamId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/series/{seriesId}/refresh:
    post:
      summary: Re-check Riot for one tournament code
      description: |
        Asks Riot about a single tournament code and records the game if one is
        found, updating the series' `games` array. Denny's already polls Riot
        for open codes every few minutes; use this to check one now instead of
        issuing a fresh code — a refresh costs nothing against the per-game code
        limit.

        Exactly **one** of `tournamentCodeId` or `shortcode` must be given.
        Unlike `/results`, omitting both is rejected: this operation is defined
        by the code it targets.

        A code that already has a game recorded is left alone and answers 200.
        That is deliberate — re-asking Riot would record a second game for the
        same match whenever the existing result was self-reported, because such
        a game carries no `riotMatchId` to recognise Riot's copy by.

        Recording a game triggers the usual completion check.
      operationId: refreshSeriesFromCode
      tags:
        - Series (v1)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSeriesDto"
      responses:
        "201":
          description: |
            Riot had a game and it was recorded. The returned series includes it
            in `games`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesWithGamesDto"
        "200":
          description: |
            Nothing to add — **not** a failure. Either Riot has no game for this
            code yet, or the code already had a result recorded. The series is
            returned unchanged; do not retry on a timer without a reason to
            think the game has since finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesWithGamesDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Series not found, the tournament code was not found, or the code
            belongs to a different series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            Both `tournamentCodeId` and `shortcode` were given, or neither was.
            Exactly one is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Riot could not be reached, so nothing could be confirmed. Distinct
            from 200: this one is worth retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/games/{gameId}/match:
    get:
      summary: Get a game's Riot match data
      description: |
        Riot's match-v5 payload for the game, as stored. Riot never changes a
        finished match, so the response is sent with
        `Cache-Control: private, max-age=31536000, immutable`.
      operationId: getGameMatch
      tags:
        - Games (v1)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Riot's match-v5 `MatchDto`
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Game not found, or its match data hasn't been ingested yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/games/{gameId}/timeline:
    get:
      summary: Get a game's Riot timeline
      description: |
        Riot's match-v5 timeline for the game, as stored. Sent with
        `Cache-Control: private, max-age=31536000, immutable`.
      operationId: getGameTimeline
      tags:
        - Games (v1)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Riot's match-v5 `TimelineDto`
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Game not found, or its timeline hasn't been ingested yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/games/{gameId}/stats:
    get:
      summary: Get a game's box score
      description: |
        One row per player and one per side, from the `player_game_stats_v1`
        and `team_game_stats_v1` views. `teamId` and `playerId` can fill in
        later (a result recorded, a Riot account linked), so the response is
        sent with `Cache-Control: private, max-age=300`.
      operationId: getGameStats
      tags:
        - Games (v1)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The game's player and team rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatsDto"
        "404":
          description: Game not found, or its match data hasn't been ingested yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stats/player-games:
    get:
      summary: List player rows across games
      description: |
        One row per player per game from `player_game_stats_v1`, newest game
        first. Every filter is optional and they combine.
      operationId: getPlayerGames
      tags:
        - Stats (v1)
      parameters:
        - $ref: "#/components/parameters/StatsEventGroupId"
        - $ref: "#/components/parameters/StatsEventId"
        - $ref: "#/components/parameters/StatsStage"
        - $ref: "#/components/parameters/StatsTeamId"
        - in: query
          name: playerId
          schema:
            type: integer
          description: Only this player's rows.
        - in: query
          name: championId
          schema:
            type: integer
          description: Only rows on this champion.
        - $ref: "#/components/parameters/StatsMinDurationSeconds"
        - $ref: "#/components/parameters/StatsLimit"
        - $ref: "#/components/parameters/StatsOffset"
      responses:
        "200":
          description: Matching player rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerGameStatsDto"
        "400":
          description: A filter has the wrong type, such as an unknown `stage`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`limit` is outside 1–1000 or `offset` is negative"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stats/team-games:
    get:
      summary: List team rows across games
      description: |
        One row per side per game from `team_game_stats_v1`, newest game
        first. Every filter is optional and they combine.
      operationId: getTeamGames
      tags:
        - Stats (v1)
      parameters:
        - $ref: "#/components/parameters/StatsEventGroupId"
        - $ref: "#/components/parameters/StatsEventId"
        - $ref: "#/components/parameters/StatsStage"
        - $ref: "#/components/parameters/StatsTeamId"
        - in: query
          name: playerId
          schema:
            type: integer
          description: Only the rows of the side this player played on, in games they played.
        - $ref: "#/components/parameters/StatsMinDurationSeconds"
        - $ref: "#/components/parameters/StatsLimit"
        - $ref: "#/components/parameters/StatsOffset"
      responses:
        "200":
          description: Matching team rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamGameStatsDto"
        "400":
          description: A filter has the wrong type, such as an unknown `stage`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`limit` is outside 1–1000 or `offset` is negative"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stats/players:
    get:
      summary: Player totals, averages and series records
      description: |
        Totals and per-game averages for each registered player, grouped on read over
        `player_game_stats_v1`. No filter means all time; `sort` plus `limit` makes a leaderboard.
        
        The series record counts a series as played when the player appears in one of its games,
        and as won or lost from the series result for the team they played for. Series that
        aren't `COMPLETE` count as played only, a double loss is lost for both teams, and a
        forfeit with no games counts for no player. `teamId` splits a record by team.
      operationId: getPlayerAggregates
      tags:
        - Stats (v1)
      parameters:
        - $ref: "#/components/parameters/StatsEventGroupId"
        - $ref: "#/components/parameters/StatsEventId"
        - $ref: "#/components/parameters/StatsStage"
        - $ref: "#/components/parameters/StatsTeamId"
        - in: query
          name: playerId
          schema:
            type: integer
        - in: query
          name: championId
          schema:
            type: integer
        - $ref: "#/components/parameters/StatsMinDurationSeconds"
        - in: query
          name: sort
          schema:
            type: string
            default: "games:desc"
          description: |
            `<stat>` or `<stat>:asc|desc` (desc when omitted). Ties break on id. One of:
            `games`, `wins`, `seriesPlayed`, `seriesWon`, `seriesLost`, `kills`, `killsPerGame`, `deaths`, `deathsPerGame`, `assists`, `assistsPerGame`, `cs`, `csPerGame`, `goldEarned`, `goldEarnedPerGame`, `damageToChampions`, `damageToChampionsPerGame`, `damageTaken`, `damageTakenPerGame`, `visionScore`, `visionScorePerGame`, `wardsPlaced`, `wardsPlacedPerGame`, `wardsKilled`, `wardsKilledPerGame`, `controlWardsBought`, `controlWardsBoughtPerGame`, `voidGrubs`, `voidGrubsPerGame`, `gameDurationSeconds`, `gameDurationSecondsPerGame`.
        - in: query
          name: minGames
          schema:
            type: integer
          description: Leave out players with fewer games, before sorting and paging.
        - $ref: "#/components/parameters/StatsLimit"
        - $ref: "#/components/parameters/StatsOffset"
      responses:
        "200":
          description: One row per group, sorted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerAggregateDto"
        "400":
          description: An unknown or malformed `sort`, or a filter with the wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`limit` is outside 1–1000 or `offset` is negative"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stats/teams:
    get:
      summary: Team totals and averages
      description: |
        Totals and per-game averages for each team, grouped on read over `team_game_stats_v1`.
        `playerId` keeps the games that player played, on their side. Until #259 merges duplicate
        team rows, a team spanning events is listed once per event.
      operationId: getTeamAggregates
      tags:
        - Stats (v1)
      parameters:
        - $ref: "#/components/parameters/StatsEventGroupId"
        - $ref: "#/components/parameters/StatsEventId"
        - $ref: "#/components/parameters/StatsStage"
        - $ref: "#/components/parameters/StatsTeamId"
        - in: query
          name: playerId
          schema:
            type: integer
        - $ref: "#/components/parameters/StatsMinDurationSeconds"
        - in: query
          name: sort
          schema:
            type: string
            default: "games:desc"
          description: |
            `<stat>` or `<stat>:asc|desc` (desc when omitted). Ties break on id. One of:
            `games`, `wins`, `firstBloods`, `firstBloodsPerGame`, `firstTowers`, `firstTowersPerGame`, `firstDragons`, `firstDragonsPerGame`, `firstBarons`, `firstBaronsPerGame`, `kills`, `killsPerGame`, `towerKills`, `towerKillsPerGame`, `inhibitorKills`, `inhibitorKillsPerGame`, `dragonKills`, `dragonKillsPerGame`, `baronKills`, `baronKillsPerGame`, `riftHeraldKills`, `riftHeraldKillsPerGame`, `hordeKills`, `hordeKillsPerGame`, `gameDurationSeconds`, `gameDurationSecondsPerGame`.
        - in: query
          name: minGames
          schema:
            type: integer
          description: Leave out teams with fewer games, before sorting and paging.
        - $ref: "#/components/parameters/StatsLimit"
        - $ref: "#/components/parameters/StatsOffset"
      responses:
        "200":
          description: One row per group, sorted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamAggregateDto"
        "400":
          description: An unknown or malformed `sort`, or a filter with the wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`limit` is outside 1–1000 or `offset` is negative"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stats/champions:
    get:
      summary: Champion picks, wins, bans and averages
      description: |
        Picks, wins and per-pick averages from player rows, and bans from team rows, per
        champion. A champion that was only banned has 0 picks and no name. `teamId` and
        `playerId` count that side's bans.
      operationId: getChampionAggregates
      tags:
        - Stats (v1)
      parameters:
        - $ref: "#/components/parameters/StatsEventGroupId"
        - $ref: "#/components/parameters/StatsEventId"
        - $ref: "#/components/parameters/StatsStage"
        - $ref: "#/components/parameters/StatsTeamId"
        - in: query
          name: playerId
          schema:
            type: integer
        - in: query
          name: championId
          schema:
            type: integer
        - $ref: "#/components/parameters/StatsMinDurationSeconds"
        - in: query
          name: sort
          schema:
            type: string
            default: "picks:desc"
          description: |
            `<stat>` or `<stat>:asc|desc` (desc when omitted). Ties break on id. One of:
            `picks`, `wins`, `bans`, `kills`, `killsPerGame`, `deaths`, `deathsPerGame`, `assists`, `assistsPerGame`, `cs`, `csPerGame`, `goldEarned`, `goldEarnedPerGame`, `damageToChampions`, `damageToChampionsPerGame`, `damageTaken`, `damageTakenPerGame`, `visionScore`, `visionScorePerGame`, `wardsPlaced`, `wardsPlacedPerGame`, `wardsKilled`, `wardsKilledPerGame`, `controlWardsBought`, `controlWardsBoughtPerGame`, `voidGrubs`, `voidGrubsPerGame`, `gameDurationSeconds`, `gameDurationSecondsPerGame`.
        - in: query
          name: minPicks
          schema:
            type: integer
          description: Leave out champions with fewer picks, before sorting and paging. `1` drops banned-only champions.
        - $ref: "#/components/parameters/StatsLimit"
        - $ref: "#/components/parameters/StatsOffset"
      responses:
        "200":
          description: One row per group, sorted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChampionAggregateDto"
        "400":
          description: An unknown or malformed `sort`, or a filter with the wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`limit` is outside 1–1000 or `offset` is negative"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

