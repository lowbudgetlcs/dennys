name: Deploy production application.

on:
  push:
    paths-ignore:
      - 'docker/**'
      - '.gitignore'
      - '*.md'
      - '*.txt'
      - 'shell.nix'
      - 'Makefile'
      - 'compose.yml'
      - 'gradlew'
      - 'gradlew.bat'
      - 'src/itest/**'
      - 'src/test/**'

    branches:
      - 'main'

jobs:
  build:
    name: Build and upload JAR
    runs-on: ubuntu-latest
    outputs:
      jar_path: ${{ steps.jar.outputs.jar_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-write-only: true

      - name: Build JAR
        run: ./gradlew clean assemble --no-daemon

      - name: Export artifact path
        id: jar
        run: |
          JAR_PATH=$(find build/libs -type f -name "*.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/libs/*.jar

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Test project
        run: ./gradlew test -x assemble

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Test project
        run: ./gradlew itest -x assemble

  build-push-image:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app
          path: build/libs

      - name: Test project
        run: ./gradlew itest -x assemble

  build-push-image:
    runs-on: ubuntu-24.04-arm
    needs: 
      - unit
      - integration
    steps:
      - uses: ./.github/actions/setup-version

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dennys
          path: build/libs
                
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          push: true
          tags: lblcs/dennys:latest
          target: deploy
          build-args: |
            JAR_FILE=build/libs/$(basename $(find build/libs -name "*.jar" | head -n 1))

  deploy:
    needs: build-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Execute docker compose on prod server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /lblcs/docker/dennys
            docker compose down
            docker compose pull
            docker compose up -d
