name: Deploy production application.

on:
  push:
    paths-ignore:
      - 'docker/**'
      - '.gitignore'
      - '*.md'
      - '*.txt'
      - 'shell.nix'
      - 'Makefile'
      - 'compose.yml'
      - 'gradlew'
      - 'gradlew.bat'
      - 'src/itest/**'
      - 'src/test/**'

    branches:
      - 'main'

jobs:
  build:
    name: Build and upload distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution
        run: ./gradlew clean installDist --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build 
          path: build

      - name: Test project
        run: ./gradlew test

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build 
          path: build

      - name: Test project
        run: ./gradlew itest

  build-push-image:
    runs-on: ubuntu-24.04-arm
    needs: 
      - unit
      - integration
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build 
          path: build
                
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          push: true
          tags: lblcs/dennys:latest
          target: deploy
          build-args: |
            DIST_PATH=./build/install/dennys

  deploy:
    needs: build-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Execute docker compose on prod server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /lblcs/docker/dennys
            docker compose down
            docker compose pull
            docker compose up -d
