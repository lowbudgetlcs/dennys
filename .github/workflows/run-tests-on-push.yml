name: Run unit and integration tests on every push to dev/** branches

on:
  push:
    paths-ignore:
      - 'docker/**'
      - '.gitignore'
      - '*.md'
      - '*.txt'
      - 'shell.nix'
      - 'Makefile'
      - 'compose.yml'
      - 'gradlew'
      - 'gradlew.bat'

    branches:
      - 'dev/**'
      - 'hotfix/**'

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-write-only: true

      - name: Build project
        run: ./gradlew clean assemble --no-daemon

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Test project
        run: ./gradlew test --no-daemon

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Test project
        run: ./gradlew itest --no-daemon
