name: Deploy a release branch to a staging environment.

on:
  push:
    paths-ignore:
      - 'docker/**'
      - '.gitignore'
      - '*.md'
      - '*.txt'
      - 'shell.nix'
      - 'Makefile'
      - 'compose.yml'
      - 'gradlew'
      - 'gradlew.bat'
      - 'src/itest/**'
      - 'src/test/**'

    branches: 
      - 'release/*'

jobs:
  build:
    name: Build and upload JAR
    runs-on: ubuntu-latest
    outputs:
      jar_path: ${{ steps.jar.outputs.jar_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-write-only: true

      - name: Build JAR
        run: ./gradlew clean installDist --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/install/dennys

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Test project
        run: ./gradlew test

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Test project
        run: ./gradlew itest

  build-push-image:
    runs-on: ubuntu-24.04-arm
    needs: 
      - unit
      - integration
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/extract-version

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: build/install/dennys
                
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          push: true
          tags: lblcs/dennys:${{ steps.setup.outputs.version }}
          target: deploy
          build-args: |
            DIST_PATH=./build/install/dennys
            
  deploy:
    needs: build-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/extract-version

      - name: Copy db migrations to Remote Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST}}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: src/migrations/sql/*
          target: /lblcs/scripts/dennys/${{ steps.setup.outputs.version }}/migrations
          overwrite: true
          strip_components: 3 

      - name: Deploy release in staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /lblcs/scripts/dennys
            ./release.sh -v ${{ steps.setup.outputs.version }} -z ${{ secrets.ZONE_ID }} -c ${{ secrets.CLOUDFLARE_DNS_TOKEN }} ${{ secrets.RIOT_API_TOKEN }}
